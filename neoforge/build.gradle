plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    forgeRuntimeLibrary("thedarkcolour:kotlinforforge-neoforge:$rootProject.kotlin_neo_version") {
        exclude group: 'net.neoforged.fancymodloader', module: 'loader'
    }

    modImplementation "com.cobblemon:neoforge:$rootProject.cobblemon_version"
    implementation "org.mongodb:mongodb-driver-sync:$rootProject.mongodb_driver_version"
    shadowBundle "org.mongodb:mongodb-driver-sync:$rootProject.mongodb_driver_version"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'neoforge_version', rootProject.neoforge_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version, minecraft_version: rootProject.minecraft_version, neoforge_version: rootProject.neoforge_version
    }
}

sourceSets {
    main {
        resources {
            srcDir '../common/src/main/resources'
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    relocate 'com.mongodb', 'com.ludwici.cobblemonpokedexnetwork.shaded.mongodb'
    relocate 'org.bson', 'com.ludwici.cobblemonpokedexnetwork.shaded.bson'
}

remapJar {
    input.set shadowJar.archiveFile
}
