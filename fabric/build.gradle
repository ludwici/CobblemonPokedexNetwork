plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation "net.fabricmc:fabric-language-kotlin:$rootProject.fabric_kotlin_version"

    modApi("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude group: "net.fabricmc.fabric-api"
    }
    modImplementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    modImplementation "com.cobblemon:fabric:$rootProject.cobblemon_version"
    implementation "org.mongodb:mongodb-driver-sync:$rootProject.mongodb_driver_version"
    shadowBundle "org.mongodb:mongodb-driver-sync:$rootProject.mongodb_driver_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    relocate 'com.mongodb', 'com.ludwici.cobblemonpokedexnetwork.shaded.mongodb'
    relocate 'org.bson', 'com.ludwici.cobblemonpokedexnetwork.shaded.bson'
}

remapJar {
    input.set shadowJar.archiveFile
}
