name: Build

on:
  push:
    branches:
      - 1.8.x
  pull_request:
    branches:
      - 1.8.x
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
          validate-wrappers: false

      - name: Build Fabric and NeoForge
        run: gradle --no-daemon --stacktrace clean build

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpn-fabric
          path: |
            fabric/build/libs/cpn-fabric-*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev-shadow.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpn-neoforge
          path: |
            neoforge/build/libs/cpn-neoforge-*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev-shadow.jar
          if-no-files-found: error
